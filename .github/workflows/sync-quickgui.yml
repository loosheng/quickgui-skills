name: Sync QuickGUI release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to sync (default: latest release)"
        type: string
      prev_tag:
        description: "Base tag for the incremental diff (default: .upstream-version)"
        type: string
      full:
        description: Regenerate the whole skill instead of an incremental update
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-quickgui
  cancel-in-progress: false

env:
  UPSTREAM_REPO: egoist/quickgui
  AGENT_MODEL: cursor-grok-4.6-high

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve versions
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PREV: ${{ inputs.prev_tag }}
          INPUT_FULL: ${{ inputs.full }}
          EVENT: ${{ github.event_name }}
        run: |
          current="$(tr -d '[:space:]' < .upstream-version 2>/dev/null || true)"
          tag="${INPUT_TAG:-$(gh api "repos/$UPSTREAM_REPO/releases/latest" -q .tag_name)}"
          prev="${INPUT_PREV:-$current}"
          [[ "$INPUT_FULL" == "true" ]] && prev=""
          branch="sync/quickgui-$tag"

          skip=false
          if [[ "$EVENT" == "schedule" ]]; then
            if [[ "$tag" == "$current" ]]; then
              echo "Already synced to $tag"
              skip=true
            elif [[ -n "$(gh pr list --head "$branch" --state open --json number -q '.[].number')" ]]; then
              echo "Open PR for $branch already exists"
              skip=true
            fi
          fi

          echo "current=$current tag=$tag prev=${prev:-<full>} skip=$skip"
          {
            echo "tag=$tag"
            echo "prev=$prev"
            echo "branch=$branch"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.resolve.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Install Cursor CLI
        if: steps.resolve.outputs.skip != 'true'
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Check Cursor CLI
        if: steps.resolve.outputs.skip != 'true'
        run: cursor-agent --version

      - name: Summarize upstream with Cursor Agent
        if: steps.resolve.outputs.skip != 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/sync.sh "${{ steps.resolve.outputs.tag }}" "${{ steps.resolve.outputs.prev }}"

      - name: Validate skills
        if: steps.resolve.outputs.skip != 'true'
        run: scripts/validate.sh

      - name: Prepare pull request body
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          PREV: ${{ steps.resolve.outputs.prev }}
        run: |
          {
            echo "Automated skill update for [$UPSTREAM_REPO $TAG](https://github.com/$UPSTREAM_REPO/releases/tag/$TAG)."
            echo
            if [[ -n "$PREV" ]]; then
              echo "Incremental update from \`$PREV\` ([compare](https://github.com/$UPSTREAM_REPO/compare/$PREV...$TAG))."
            else
              echo "Full regeneration."
            fi
            echo
            echo "Generated by Cursor Agent (\`$AGENT_MODEL\`) using \`prompts/sync-skill.md\`."
            echo
            echo "## Upstream release notes"
            echo
            gh release view "$TAG" -R "$UPSTREAM_REPO" --json body -q .body || echo "(unavailable)"
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Create pull request
        if: steps.resolve.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ steps.resolve.outputs.branch }}
          delete-branch: true
          add-paths: |
            skills/**
            .upstream-version
          commit-message: "feat: sync quickgui skill to ${{ steps.resolve.outputs.tag }}"
          title: "feat: sync quickgui skill to ${{ steps.resolve.outputs.tag }}"
          body-path: ${{ runner.temp }}/pr-body.md
          labels: upstream-sync
